name: Package Extension Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Extension ZIP Bundle
        run: |
          mkdir -p dist
          zip -r dist/AutoBookmark.zip \
            manifest.json \
            background.js \
            content.js \
            content.css \
            popup.html \
            popup.js \
            popup.css \
            sinary-logo.svg \
            icons/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/AutoBookmark.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
